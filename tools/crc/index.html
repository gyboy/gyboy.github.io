    (function () {
      var t = localStorage.getItem('gyboy-theme');
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);

  <style>
    /* ---------- CRC 页专属：位宽步进器与位点阵 ---------- */
    .stepper { display: flex; align-items: center; gap: 6px; }
    .stepper button {
      width: 30px; height: 34px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg); color: var(--text); font-size: 1rem; cursor: pointer;
      transition: border-color 0.15s;
    }
    .stepper button:hover { border-color: var(--accent); }
    .stepper input {
      width: 100%; min-width: 0; text-align: center;
      padding: 7px 6px; font-size: 0.9rem; font-family: ui-monospace, Consolas, monospace;
      color: var(--text); background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; outline: none;
    }
    .stepper input:focus { border-color: var(--accent); }
    .params-grid input[type="text"]:disabled, .params-grid .stepper input:disabled { opacity: 0.6; cursor: not-allowed; }

    .bit-wrap { overflow-x: auto; padding-bottom: 4px; }
    .bit-grid {
      display: grid;
      grid-template-columns: repeat(32, minmax(17px, 1fr));
      gap: 3px;
      min-width: 580px;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    }
    .bit-cell { text-align: center; }
    .bit-cell .bit-num { display: block; font-size: 0.58rem; color: var(--text-2); line-height: 1.4; }
    .bit-cell .bit-val {
      display: flex; align-items: center; justify-content: center;
      height: 22px; border: 1px solid var(--border); border-radius: 5px;
      background: var(--bg); font-size: 0.72rem; color: var(--text);
    }
    .bit-cell.on .bit-val { background: var(--accent-weak); border-color: var(--accent); color: var(--accent); font-weight: 700; }
    .bit-cell.off .bit-val { opacity: 0.25; }
    .hex-opts { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
    .hex-opts label, .enc-row label {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.82rem; color: var(--text-2); cursor: pointer;
    }
    .hex-opts input, .enc-row input { accent-color: var(--accent); }
    .enc-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .enc-row select {
      padding: 6px 10px; font-size: 0.85rem; font-family: inherit; color: var(--text);
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px; outline: none; cursor: pointer;
    }
    .enc-row select:focus { border-color: var(--accent); }
  </style>
</head>

      /* ---------- 核心算法 ---------- */
      function reverseBitsBig(data, bitLen) {
        var tmp = 0n;
        var d = BigInt(data);
        for (var i = 0n; i < BigInt(bitLen); i++) {
          tmp = (tmp << 1n) | (d & 1n);
          d >>= 1n;
        }
        return tmp;
      }
      /* 与 Python crc_generate 逐行等价；统一使用 BigInt（JS 32 位移位运算
         对 width=32 会溢出回绕，BigInt 对 1~64 位全部精确） */
      function crcGenerate(width, poly, init, refIn, refOut, xorOut, data) {
        if (!data.length) return 0n;
        var W = BigInt(width);
        var topBit = 1n << (W - 1n);
        var mask = (1n << W) - 1n;
        var crc = BigInt(init) & mask;
        var poly2 = BigInt(poly) & mask, xor2 = BigInt(xorOut) & mask;
        for (var k = 0; k < data.length; k++) {
          var dat = BigInt(data[k]);
          if (refIn) dat = reverseBitsBig(dat, 8);
          for (var b = 0; b < 8; b++) {
            var bit = ((crc & topBit) !== 0n ? 1n : 0n) ^ ((dat & 0x80n) !== 0n ? 1n : 0n);
            dat = (dat << 1n) & 0xFFn;
            crc = (crc << 1n) & mask;
            if (bit) crc ^= poly2;
          }
        }
        if (refOut) crc = reverseBitsBig(crc, width);
        return (crc ^ xor2) & mask;
      }

      /* ---------- GBK 编码（基于 gbk-enc.js 索引串） ---------- */
      var gbkMap = null;
      function gbkEncode(str) {
        var table = window.GBK_INDEX_STR;
        if (!table) return null;
        if (!gbkMap) {
          gbkMap = {};
          for (var i = 0; i < table.length; i++) {
            var c = table.charAt(i);
            if (c === '\u0000' || (c in gbkMap)) continue;
            var lead = 0x81 + Math.floor(i / 190), tp = i % 190;
            gbkMap[c] = tp < 0x3F ? [lead, 0x40 + tp] : [lead, 0x41 + tp];
          }
        }
        var out = [];
        for (var j = 0; j < str.length; j++) {
          var ch = str.charAt(j), code = str.charCodeAt(j);
          if (code < 0x80) { out.push(code); continue; }
          if (code === 0x20AC) { out.push(0x80); continue; } /* cp936 单字节 € */
          var m = gbkMap[ch];
          if (!m) return null; /* 不可映射 → 整体按空数据处理（与源实现一致） */
          out.push(m[0], m[1]);
        }
        return out;
      }

      /* ---------- 输入解析 ---------- */
      var state = { mode: 'hex' };
      function parseHexInput(text) {
        var parts = text.trim().split(/\s+/).filter(function (p) { return p.length; });
        var hexStr = '';
        for (var i = 0; i < parts.length; i++) {
          var p = parts[i];
          if (!/^[0-9a-fA-F]+$/.test(p)) return null;
          if (p.length % 2 === 1) p = '0' + p;
          hexStr += p;
        }
        var bytes = [];
        for (var j = 0; j < hexStr.length; j += 2) bytes.push(parseInt(hexStr.substr(j, 2), 16));
        return bytes;
      }
      function textToBytes(text, enc) {
        if (enc === 'UTF-8') {
          return Array.prototype.slice.call(new TextEncoder().encode(text));
        }
        if (enc === 'GBK') {
          var b = gbkEncode(text);
          return b === null ? [] : b;
        }
        /* ASCII：非 ASCII 字符 → 空数据（与源实现一致） */
        for (var i = 0; i < text.length; i++) {
          if (text.charCodeAt(i) >= 0x80) return [];
        }
        var out = [];
        for (var j = 0; j < text.length; j++) out.push(text.charCodeAt(j));
        return out;
      }
      function currentData() {
        var text = $('data-input').value;
        if (state.mode === 'hex') {
          var bytes = parseHexInput(text);
          if (bytes === null) return [];
          if ($('rev-word').checked) {
            var arr = [];
            for (var i = 0; i < bytes.length; i += 4) {
              var chunk = bytes.slice(i, i + 4).reverse();
              arr = arr.concat(chunk);
            }
            bytes = arr;
          }
          if ($('rev-data').checked) bytes.reverse();
          return bytes;
        }
        return textToBytes(text, $('enc-select').value);
      }

      /* ---------- 参数读写与反向匹配 ---------- */
      function parseHexField(s, width) {
        s = String(s).trim().replace(/^0[xX]/, '');
        if (!/^[0-9a-fA-F]+$/.test(s)) return null;
        return width > 32 ? BigInt('0x' + s) : parseInt(s, 16);
      }
      function readParams() {
        var width = parseInt($('p-width').value, 10);
        if (!isFinite(width) || width < 1 || width > 64) return null;
        var poly = parseHexField($('p-poly').value, width);
        var init = parseHexField($('p-init').value, width);
        var xorOut = parseHexField($('p-xor').value, width);
        if (poly === null || init === null || xorOut === null) return null;
        return { width: width, poly: poly, init: init, refIn: $('p-refin').checked, refOut: $('p-refout').checked, xorOut: xorOut };
      }
      function hexField(v) { return '0x' + BigInt(v).toString(16).toUpperCase(); }
      /* 参数变化后反向匹配预设（与 Python match_crc_preset 一致） */
      function matchPreset() {
        var p = readParams();
        if (!p) { $('model-select').value = CUSTOM_ID; return; }
        var check = crcGenerate(p.width, p.poly, p.init, p.refIn, p.refOut, p.xorOut,
          [0x31, 0x32, 0x33, 0x34, 0x35, 0x36, 0x37, 0x38, 0x39]);
        $('p-check').value = '0x' + check.toString(16).toUpperCase();
        var matched = CUSTOM_ID;
        for (var name in PRESETS) {
          var m = PRESETS[name];
          if (m[0] === p.width &&
              BigInt(m[1]) === BigInt(p.poly) && BigInt(m[2]) === BigInt(p.init) &&
              m[3] === p.refIn && m[4] === p.refOut && BigInt(m[5]) === BigInt(p.xorOut)) { matched = name; break; }
        }
        $('model-select').value = matched;
      }
      function loadPreset(name) {
        $('model-select').value = name;
        if (name !== CUSTOM_ID) {
          var m = PRESETS[name];
          $('p-width').value = String(m[0]);
          $('p-refin').checked = m[3];
          $('p-refout').checked = m[4];
          $('p-poly').value = hexField(m[1]);
          $('p-init').value = hexField(m[2]);
          $('p-xor').value = hexField(m[5]);
          var check = crcGenerate(m[0], m[1], m[2], m[3], m[4], m[5],
            [0x31, 0x32, 0x33, 0x34, 0x35, 0x36, 0x37, 0x38, 0x39]);
          $('p-check').value = '0x' + check.toString(16).toUpperCase();
        }
        calc();
      }

      /* ---------- 位显示点阵（64 格，两行 32，与源实现布局一致） ---------- */
      var bitCells = [];
      function buildBitGrid() {
        var grid = $('bit-grid');
        grid.innerHTML = '';
        bitCells = [];
        for (var bit = 63; bit >= 0; bit--) {
          var cell = document.createElement('div');
          cell.className = 'bit-cell';
          var num = document.createElement('span');
          num.className = 'bit-num';
          num.textContent = String(bit);
          var val = document.createElement('span');
          val.className = 'bit-val';
          cell.appendChild(num);
          cell.appendChild(val);
          /* col=(63-bit)%32, row=(63-bit)//32 → MSB 在左 */
          cell.style.gridColumn = String(((63 - bit) % 32) + 1);
          cell.style.gridRow = String(Math.floor((63 - bit) / 32) * 2 + 1);
          grid.appendChild(cell);
          bitCells.push({ bit: bit, val: val, cell: cell });
        }
      }

      /* ---------- 渲染 ---------- */
      function toW(n, radix, minLen) {
        var s = n.toString(radix).toUpperCase();
        while (s.length < minLen) s = '0' + s;
        return s;
      }
      function calc() {
        var p = readParams();
        if (!p) return; /* 参数非法时保持现状（与源实现一致） */
        var data = currentData();
        var crc = crcGenerate(p.width, p.poly, p.init, p.refIn, p.refOut, p.xorOut, data);

        $('summary').textContent = (state.mode === 'hex' ? 'HEX' : 'TEXT') +
          ' · ' + data.length + ' ' + I18N.t('crc.bytes');
        $('r-hex').textContent = toW(crc, 16, Math.floor(p.width / 4));
        $('r-dec').textContent = crc.toString(10);
        $('r-oct').textContent = crc.toString(8);
        $('r-bin').textContent = toW(crc, 2, p.width);
        for (var i = 0; i < bitCells.length; i++) {
          var bc = bitCells[i];
          if (bc.bit < p.width) {
            var v = Number((BigInt(crc) >> BigInt(bc.bit)) & 1n);
            bc.val.textContent = String(v);
            bc.cell.className = 'bit-cell' + (v ? ' on' : '');
          } else {
            bc.val.textContent = '';
            bc.cell.className = 'bit-cell off';
          }
        }
      }
      function updateHint() {
        $('input-hint').textContent = I18N.t(state.mode === 'hex' ? 'crc.hexHint' : 'crc.asciiHint');
        $('data-input').placeholder = state.mode === 'hex' ? '31 32 33 34' : '123456789';
        $('hex-opts').style.display = state.mode === 'hex' ? '' : 'none';
        $('enc-row').style.display = state.mode === 'text' ? '' : 'none';
      }
      function refreshChips() {
        document.querySelectorAll('#seg-mode .seg-btn').forEach(function (b) {
          b.classList.toggle('active', b.getAttribute('data-mode') === state.mode);
        });
      }

      /* ---------- 模型下拉（按位宽分组） ---------- */
      function buildModelSelect() {
        var sel = $('model-select');
        var groups = [
          { label: 'CRC-3 ~ 7', test: function (w) { return w <= 7; } },
          { label: 'CRC-8', test: function (w) { return w === 8; } },
          { label: 'CRC-10 ~ 15', test: function (w) { return w >= 10 && w <= 15; } },
          { label: 'CRC-16', test: function (w) { return w === 16; } },
          { label: 'CRC-24 ~ 31', test: function (w) { return w >= 24 && w <= 31; } },
          { label: 'CRC-32', test: function (w) { return w === 32; } },
          { label: 'CRC-40 / 64', test: function (w) { return w >= 40; } }
        ];
        var cur = sel.value || 'CRC-32';
        sel.innerHTML = '';
        groups.forEach(function (g) {
          var og = document.createElement('optgroup');
          og.label = g.label;
          for (var name in PRESETS) {
            if (!g.test(PRESETS[name][0])) continue;
            var o = document.createElement('option');
            o.value = name;
            o.textContent = name;
            og.appendChild(o);
          }
          if (og.children.length) sel.appendChild(og);
        });
        var oc = document.createElement('option');
        oc.value = CUSTOM_ID;
        oc.textContent = I18N.t('crc.custom');
        sel.appendChild(oc);
        sel.value = cur;
        if (sel.value !== cur) { sel.value = 'CRC-32'; }
      }

      /* ---------- 事件绑定 ---------- */
      function bind() {
        $('model-select').addEventListener('change', function () { loadPreset(this.value); });
        $('bit-minus').addEventListener('click', function () { stepWidth(-1); });
        $('bit-plus').addEventListener('click', function () { stepWidth(1); });
        ['p-width', 'p-poly', 'p-init', 'p-xor'].forEach(function (id) {
          $(id).addEventListener('input', function () { matchPreset(); calc(); });
        });
        ['p-refin', 'p-refout'].forEach(function (id) {
          $(id).addEventListener('change', function () { matchPreset(); calc(); });
        });
        document.querySelectorAll('#seg-mode .seg-btn').forEach(function (b) {
          b.addEventListener('click', function () {
            state.mode = b.getAttribute('data-mode');
            refreshChips();
            updateHint();
            calc();
          });
        });
        $('data-input').addEventListener('input', calc);
        ['rev-word', 'rev-data'].forEach(function (id) { $(id).addEventListener('change', calc); });
        $('enc-select').addEventListener('change', calc);
        document.addEventListener('langchange', function () {
          buildModelSelect();
          updateHint();
          calc();
        });
      }
      function stepWidth(d) {
        var v = parseInt($('p-width').value, 10);
        if (!isFinite(v)) return;
        v = Math.max(1, Math.min(64, v + d));
        $('p-width').value = String(v);
        matchPreset();
        calc();
      }

      buildBitGrid();
      buildModelSelect();
      updateHint();
      refreshChips();
      bind();
      loadPreset('CRC-32');

      /* 供自动化测试 */
      window.__CRC_TEST = {
        crcGenerate: crcGenerate,
        PRESETS: PRESETS,
        parseHexInput: parseHexInput,
        gbkEncode: gbkEncode,
        currentData: currentData,
        readParams: readParams
      };
    })();
  </script>
</body>
</html>
