        </div>
        <div id="namesList"></div>
        <div class="dialog-buttons">
            <button id="saveNamesBtn" data-sen="save">保存修改</button>
            <button class="secondary" id="exportModifiedTxtBtn" data-sen="exportDataBtn">导出数据</button>
            <button class="secondary" id="closeDialogBtn" data-sen="close">关闭</button>
        </div>
    </div>

    <script>
        (function () {
            var saved = localStorage.getItem('theme') || localStorage.getItem('gyboy-theme');
            if (saved === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
            function applyIcon() {
                var btn = document.getElementById('themeToggle');
                if (!btn) return;
                var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                btn.textContent = isDark ? '☀️' : '🌙';
            }
            applyIcon();
            document.addEventListener('DOMContentLoaded', function () {
                applyIcon();
                document.getElementById('themeToggle').addEventListener('click', function () {
                    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                    var next = isDark ? 'light' : 'dark';
                    if (next === 'dark') {
                        document.documentElement.setAttribute('data-theme', 'dark');
                    } else {
                        document.documentElement.removeAttribute('data-theme');
                    }
                    localStorage.setItem('theme', next);
                    localStorage.setItem('gyboy-theme', next);
                    applyIcon();
                    if (window.Plotly && typeof updatePlotlyTheme === 'function') {
                        updatePlotlyTheme();
                    }
                });
            });
        })();

        // 防止 initPlotlyApp 被重复调用导致事件绑定丢失
        let _appInitialized = false;
        window.initPlotlyApp = function () {
            if (_appInitialized) return;
            _appInitialized = true;

            const state = {
                datasets: [],
                activeIndices: [],
                highlightId: null,
                xAxisMode: 'phase',
                sort: { key: 'name', order: 'asc' },
                limits: {},
                originalContent: '',
                analysisEnabled: false,
                columnFilters: {},
                showColumnFilters: false,
                usingEmbeddedData: false,
                embeddedDataLoaded: false,
                configDeletedIds: new Set(),
                configExportIds: new Set(),
                dataFormat: 'V3'
            };

            const COLORS = ['#0052CC', '#00B8D9', '#36B37E', '#FFAB00', '#FF5630', '#6554C0', '#FF7452', '#4C9AFF', '#8777D9', '#57D9A3'];

            /* ===== 新增：中英文切换 ===== */
            const SEN_STR = {
                navBack: ['← 返回首页', '← Back'],
                themeTitle: ['切换主题', 'Toggle theme'],
                uploadTxt: ['📂 上传 TXT 数据', '📂 Upload TXT Data'],
                dataConfig: ['⚙️ 数据配置', '⚙️ Data Config'],
                filters: ['数据过滤', 'Filters'],
                filterName: ['曲线名称过滤', 'Filter by name'],
                namePh: ['输入关键字过滤...', 'Filter by keyword...'],
                colFilter: ['显示列筛选（在表格列头下方）', 'Show column filters (below headers)'],
                profileRate: ['Profile和速率组合', 'Profile & Rate combos'],
                limits: ['分析标准', 'Pass Limits'],
                axesStyle: ['坐标轴与样式', 'Axes & Style'],
                xAxisContent: ['X轴显示内容', 'X axis'],
                modePhase: ['相位 (Phase)', 'Phase'],
                modePower: ['发射功率 (Power)', 'Tx Power'],
                modeRL: ['回波损耗 (RL)', 'Return Loss'],
                xTick: ['X 步进(Tick)', 'X Tick'],
                yTick: ['Y 步进(Tick)', 'Y Tick'],
                lineWidth: ['线宽', 'Line width'],
                markerSize: ['点大小', 'Marker size'],
                resetView: ['重置视图范围', 'Reset view range'],
                exportPng: ['📷 导出图片 (PNG)', '📷 Export chart (PNG)'],
                exportReport: ['📝 生成分析报告', '📝 Generate report'],
                welcomeTitle: ['欢迎使用', 'Welcome'],
                welcomeSub: ['请在左侧侧边栏导入数据开始分析', 'Import data via the sidebar to start'],
                dlgTitle: ['数据配置', 'Data Config'],
                selectAll: ['全选', 'Select all'],
                save: ['保存修改', 'Save'],
                exportDataBtn: ['导出数据', 'Export TXT'],
                close: ['关闭', 'Close'],
                delCurve: ['删除此曲线', 'Delete this trace'],
                restoreCurve: ['恢复此曲线', 'Restore this trace'],
                exportCount: ['已选择 %A% / %B% 条曲线用于导出', '%A% / %B% traces selected for export'],
                noData: ['请先导入数据', 'Import data first'],
                parseFail: ['数据解析失败，请确认文件格式正确。\n错误信息: ', 'Failed to parse the data.\nError: '],
                noValid: ['未能识别有效数据，请确认文件包含 ##Reader_sensitivity_measurement_V3 或 V4 标记。',
                          'No valid data found: the file must contain ##Reader_sensitivity_measurement_V3 or V4 markers.'],
                readFail: ['文件读取失败，请重试。', 'Failed to read the file. Please retry.'],
                chooseType: ['请选择导出类型：\n1. MD报告\n2. CSV表格\n输入1或2',
                             'Choose export type:\n1. MD report\n2. CSV table\nEnter 1 or 2'],
                chartHint: ['双击表格行高亮曲线 · 滚轮/框选缩放', 'Double-click a row to highlight · scroll/drag to zoom'],
                showAll: ['全部显示', 'Show all'],
                hideAll: ['全部隐藏', 'Hide all'],
                dropHere: ['📄 松开以解析 TXT 文件', '📄 Drop to parse the TXT file'],
                embeddedLoaded: ['📂 内置数据已加载 (上传已禁用)', '📂 Embedded data loaded (upload disabled)'],
                embedded: ['嵌入数据', 'Embedded data'],
                notConfigured: ['(未配置)', '(not configured)'],
                embeddedInfo1: ['内置数据已加载', 'Embedded data loaded'],
                embeddedInfo2: ['此页面包含预置的测试数据，您仍可上传新文件覆盖当前数据。',
                                'This page contains preset test data; you can still upload a new file to replace it.'],
                colName: ['数据集名称(Name)', 'Name'],
                colPower: ['发射功率(Power Avg)', 'Tx Power (Avg)'],
                colRL: ['回波损耗(RL)', 'Return Loss'],
                colMin: ['最小灵敏度(Min Sens)', 'Min Sens'],
                colMax: ['最大灵敏度(Max Sens)', 'Max Sens'],
                colAvg: ['平均灵敏度(Avg Sens)', 'Avg Sens'],
                colRange: ['灵敏度范围(Range)', 'Range'],
                colStatus: ['测试结果(Status)', 'Status'],
                repTitle: ['Xplore 灵敏度测试数据分析报告', 'Xplore Sensitivity Test Analysis Report'],
                repTime: ['生成时间', 'Generated at'],
                repFile: ['数据文件', 'Data file'],
                repOverview: ['数据概况', 'Overview'],
                repTotal: ['总曲线数', 'Total traces'],
                repShown: ['当前显示曲线数', 'Shown traces'],
                repLimitsSec: ['灵敏度合格线 (dBm) 设置', 'Sensitivity limits (dBm)'],
                repCombo: ['组合', 'Combo'],
                repLimitCol: ['合格线 (dBm)', 'Limit (dBm)'],
                repNoneSet: ['当前未设置任何灵敏度合格线。', 'No limits configured.'],
                repSummarySec: ['统计摘要', 'PASS/FAIL summary'],
                repTotalCol: ['总数', 'Total'],
                repRateCol: ['合格率', 'Pass rate'],
                repOverall: ['总体合格率', 'Overall pass rate'],
                repTotalTests: ['总测试数', 'Total tests'],
                repDetail: ['详细数据', 'Detailed data'],
                repResult: ['结果', 'Result']
            };
            function senLang() { return localStorage.getItem('sen-lang') === 'en' ? 'en' : 'zh'; }
            function senT(key) {
                const e = SEN_STR[key];
                if (!e) return key;
                return senLang() === 'en' ? (e[1] || e[0]) : e[0];
            }
            function welcomeHtml() {
                return '<div style="font-size:40px; margin-bottom:12px; opacity:0.4;">📊</div>' +
                    '<h3 style="color:var(--text-main); margin-bottom:8px; font-weight:600;">' + senT('welcomeTitle') + '</h3>' +
                    '<p style="font-size:13px;">' + senT('welcomeSub') + '</p>';
            }
            function applySenLang() {
                document.querySelectorAll('[data-sen]').forEach(el => { el.textContent = senT(el.getAttribute('data-sen')); });
                document.querySelectorAll('[data-sen-placeholder]').forEach(el => { el.placeholder = senT(el.getAttribute('data-sen-placeholder')); });
                document.querySelectorAll('[data-sen-title]').forEach(el => { el.title = senT(el.getAttribute('data-sen-title')); });
                const lt = document.getElementById('langToggle');
                if (lt) {
                    lt.textContent = senLang() === 'zh' ? 'EN' : '中';
                    lt.title = senLang() === 'zh' ? 'Switch to English' : '切换到中文';
                }
                buildTableHeader();
                renderTableBody();
                generateProfileAndRateFilters();
                if (state.analysisEnabled) buildLimitsPanel();
                updateConfigExportCount();
                if (state.datasets.length === 0 && !state.usingEmbeddedData) {
                    const wo = document.getElementById('welcomeOverlay');
                    if (wo && wo.style.display !== 'none') wo.innerHTML = welcomeHtml();
                }
            }

            function getCSSVar(name) {
                return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
            }

            function getThemeColors() {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                return {
                    plotBg: getCSSVar('--chart-bg') || '#ffffff',
                    gridColor: getCSSVar('--chart-grid') || '#eeeeee',
                    textColor: getCSSVar('--text-main') || '#1f2937',
                    mutedLine: isDark ? '#4a4a6a' : '#cccccc',
                    legendBg: isDark ? 'rgba(30,33,48,0.9)' : 'rgba(255,255,255,0.9)',
                    paperBg: getCSSVar('--chart-bg') || '#ffffff'
                };
            }

            // ---------- 列配置 ----------
            const baseColumns = [
                { key: 'name', sen: 'colName', type: 'text' },
                { key: 'powerAvg', sen: 'colPower', type: 'number' },
                { key: 'returnLoss', sen: 'colRL', type: 'number' },
                { key: 'min', sen: 'colMin', type: 'number' },
                { key: 'max', sen: 'colMax', type: 'number' },
                { key: 'avg', sen: 'colAvg', type: 'number' },
                { key: 'range', sen: 'colRange', type: 'number' }
            ];

            function getCurrentColumns() {
                if (state.analysisEnabled) {
                    return [...baseColumns, { key: 'status', sen: 'colStatus', type: 'text' }];
                }
                return baseColumns;
            }

            // 初始化列筛选条件
            function initColumnFilters() {
                const cols = getCurrentColumns();
                cols.forEach(col => {
                    if (col.type === 'text') {
                        if (!state.columnFilters[col.key]) state.columnFilters[col.key] = { text: '' };
                        else if (state.columnFilters[col.key].text === undefined) state.columnFilters[col.key].text = '';
                    } else { // number
                        if (!state.columnFilters[col.key]) state.columnFilters[col.key] = { min: null, max: null };
                        else {
                            if (state.columnFilters[col.key].min === undefined) state.columnFilters[col.key].min = null;
                            if (state.columnFilters[col.key].max === undefined) state.columnFilters[col.key].max = null;
                        }
                    }
                });
            }
            initColumnFilters();

            // ---------- 文件加载 ----------
            document.getElementById('fileInput').onchange = (e) => handleFile(e.target.files[0]);
            const dropZone = document.getElementById('dropZone');
            dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
            dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('drag-over'); });
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('drag-over');
                if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
            });
            document.getElementById('configBtn').onclick = openConfigDialog;
            document.getElementById('closeDialogBtn').onclick = closeConfigDialog;
            document.getElementById('saveNamesBtn').onclick = saveNames;
            document.getElementById('exportModifiedTxtBtn').onclick = exportData;
            document.getElementById('overlay').onclick = closeConfigDialog;

            // ---------- 嵌入数据开关 ----------
            const embeddedToggle = document.getElementById('embeddedDataToggle');
            const embeddedNoDataTip = document.getElementById('embeddedNoDataTip');
            const sealConfigBtn = document.getElementById('sealConfigBtn');
            const isSealed = EMBEDDED_DATA_CONFIG._seal === true;

            // 检测是否有可用的嵌入数据
            function hasEmbeddedData() {
                return typeof EMBEDDED_DATA_CONFIG !== 'undefined'
                    && EMBEDDED_DATA_CONFIG.enabled
                    && EMBEDDED_DATA_CONFIG.base64Data
                    && EMBEDDED_DATA_CONFIG.base64Data.trim() !== '';
            }

            // 初始化嵌入数据开关状态
            if (!hasEmbeddedData()) {
                embeddedToggle.checked = false;
                embeddedToggle.disabled = true;
                embeddedNoDataTip.style.display = 'inline';
            } else {
                embeddedNoDataTip.style.display = 'none';
            }

            // 已锁定：隐藏开关、锁定按钮、禁用上传
            if (isSealed) {
                document.querySelector('.embedded-toggle-label').style.display = 'none';
                sealConfigBtn.style.display = 'none';
                (async () => {
                    const valid = await verifyConfigSeal();
                    if (!valid) {
                        document.querySelector('.embedded-toggle-row').innerHTML =
                            '<span style="color:var(--danger-color);font-size:12px;font-weight:500;">⚠ 配置完整性校验失败，数据可能已被篡改</span>';
                        embeddedToggle.disabled = true;
                        return;
                    }
                    const badge = document.createElement('span');
                    badge.className = 'config-sealed-badge';
                    badge.textContent = '🔒 配置已锁定';
                    document.querySelector('.embedded-toggle-row').appendChild(badge);
                })();
            } else if (hasEmbeddedData()) {
                sealConfigBtn.style.display = 'inline-block';
            }

            // ---------- 锁定配置功能 ----------
            sealConfigBtn.addEventListener('click', async () => {
                if (isSealed) return;
                sealConfigBtn.disabled = true;
                sealConfigBtn.textContent = '⏳ 生成中...';
                try {
                    const hash = await computeConfigHash(EMBEDDED_DATA_CONFIG);
                    const sealedConfigStr =
                        `const EMBEDDED_DATA_CONFIG = {
            enabled: ${EMBEDDED_DATA_CONFIG.enabled},
            disableFileUpload: ${EMBEDDED_DATA_CONFIG.disableFileUpload},
            base64Data: ${JSON.stringify(EMBEDDED_DATA_CONFIG.base64Data)},
            description: ${JSON.stringify(EMBEDDED_DATA_CONFIG.description)},
            loadMessage: ${JSON.stringify(EMBEDDED_DATA_CONFIG.loadMessage)},
            _seal: true,
            _sealHash: "${hash}"
        };`;
                    let html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
                    html = html.replace(
                        /const EMBEDDED_DATA_CONFIG\s*=\s*\{[\s\S]*?\}\s*;/,
                        sealedConfigStr
                    );
                    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    const baseName = document.title.replace(/[^a-zA-Z0-9\u4e00-\u9fff_-]/g, '_');
                    a.download = baseName + '_已锁定.html';
                    a.click();
                    URL.revokeObjectURL(url);
                    sealConfigBtn.textContent = '✅ 已生成';
                    setTimeout(() => { sealConfigBtn.textContent = '🔒 锁定'; sealConfigBtn.disabled = false; }, 2000);
                } catch (err) {
                    console.error('锁定配置失败:', err);
                    alert('锁定配置失败: ' + err.message);
                    sealConfigBtn.textContent = '🔒 锁定';
                    sealConfigBtn.disabled = false;
                }
            });

            // 嵌入数据开关事件
            embeddedToggle.addEventListener('change', (e) => {
                if (e.target.checked) {
                    if (!hasEmbeddedData()) {
                        e.target.checked = false;
                        return;
                    }
                    loadEmbeddedData();
                } else {
                    // 关闭嵌入数据：清空数据，恢复欢迎界面
                    state.datasets = [];
                    state.activeIndices = [];
                    state.originalContent = '';
                    state.usingEmbeddedData = false;
                    state.embeddedDataLoaded = false;
                    state.highlightId = null;
                    state.columnFilters = {};
                    state.limits = {};
                    document.getElementById('embeddedBadge').style.display = 'none';
                    document.getElementById('embeddedDataInfo').style.display = 'none';
                    document.getElementById('fileName').textContent = '';
                    document.getElementById('welcomeOverlay').style.display = '';
                    document.getElementById('welcomeOverlay').innerHTML = welcomeHtml();
                    document.getElementById('tableCard').style.display = 'none';
                    document.getElementById('configBtn').style.display = 'none';
                    document.getElementById('filterValuesList').innerHTML = '';
                    if (state.analysisEnabled) {
                        document.getElementById('limitsList').innerHTML = '';
                        document.getElementById('limitsList').classList.add('collapsed');
                    }
                    // 恢复文件上传功能
                    document.getElementById('dropZone').classList.remove('disabled');
                    document.getElementById('fileInput').disabled = false;
                    document.getElementById('dropZone').querySelector('div').textContent = '📂 上传 TXT 数据';
                    updateChart();
                }
            });

            // 加载嵌入式数据
            function loadEmbeddedData() {
                if (!hasEmbeddedData()) return;
                const decoded = decodeBase64Data(EMBEDDED_DATA_CONFIG.base64Data);
                if (!decoded) {
                    document.getElementById('welcomeOverlay').style.display = '';
                    document.getElementById('welcomeOverlay').innerHTML =
                        '<h3 style="color:var(--danger-color);">内置数据解码失败</h3>' +
                        '<p>请检查EMBEDDED_DATA_CONFIG中的base64Data是否正确</p>';
                    embeddedToggle.checked = false;
                    return;
                }
                state.originalContent = decoded;
                state.usingEmbeddedData = true;
                state.embeddedDataLoaded = true;
                document.getElementById('fileName').textContent =
                    '内置: ' + (EMBEDDED_DATA_CONFIG.description || 'Xplore数据');
                document.getElementById('welcomeOverlay').style.display = 'none';
                document.getElementById('tableCard').style.display = 'flex';
                document.getElementById('configBtn').style.display = 'inline-block';
                document.getElementById('embeddedBadge').style.display = 'inline-block';
                document.getElementById('embeddedDataInfo').style.display = 'block';

                try {
                    parseData(state.originalContent);
                } catch (err) {
                    console.error('解析嵌入数据出错:', err);
                    document.getElementById('welcomeOverlay').style.display = '';
                    document.getElementById('welcomeOverlay').innerHTML =
                        '<h3 style="color:var(--danger-color);">内置数据解析失败</h3>' +
                        '<p>错误信息: ' + err.message + '</p>';
                    embeddedToggle.checked = false;
                    state.usingEmbeddedData = false;
                    state.embeddedDataLoaded = false;
                    return;
                }
                if (state.datasets.length === 0) {
                    document.getElementById('welcomeOverlay').style.display = '';
                    document.getElementById('welcomeOverlay').innerHTML =
                        '<h3 style="color:var(--danger-color);">内置数据无效</h3>' +
                        '<p>嵌入的数据未包含有效的 ##Reader_sensitivity_measurement_V3 或 V4 标记</p>';
                    embeddedToggle.checked = false;
                    state.usingEmbeddedData = false;
                    state.embeddedDataLoaded = false;
                    return;
                }
                state.activeIndices = state.datasets.map(d => d.id);
                if (state.analysisEnabled) buildLimitsPanel();
                generateProfileAndRateFilters();
                state.columnFilters = {};
                state.showColumnFilters = false;
                toggleFilterCheckbox.checked = false;
                initColumnFilters();
                buildTableHeader();
                renderTableBody();
                updateChart();

                // 根据配置禁用文件上传
                if (EMBEDDED_DATA_CONFIG.disableFileUpload) {
                    document.getElementById('dropZone').classList.add('disabled');
                    document.getElementById('fileInput').disabled = true;
                    document.getElementById('dropZone').querySelector('div').textContent = senT('embeddedLoaded');
                    // 禁用嵌入数据开关，防止用户通过关闭开关恢复上传
                    embeddedToggle.disabled = true;
                }
            }

            // 分析标准开关
            document.getElementById('analysisToggle').addEventListener('change', (e) => {
                state.analysisEnabled = e.target.checked;
                const limitsBody = document.getElementById('limitsList');
                if (state.analysisEnabled) {
                    limitsBody.classList.remove('collapsed');
                    buildLimitsPanel();
                } else {
                    limitsBody.classList.add('collapsed');
                    limitsBody.innerHTML = '';
                }
                // 列配置变化，重新初始化筛选条件（但保留已有值，只补全新列）
                initColumnFilters();
                buildTableHeader();
                renderTableBody();
                updateChart();
            });

            // 显示/隐藏列筛选复选框 (现在位于侧边栏)
            const toggleFilterCheckbox = document.getElementById('toggleColumnFilter');
            toggleFilterCheckbox.checked = state.showColumnFilters; // 初始false
            toggleFilterCheckbox.addEventListener('change', (e) => {
                state.showColumnFilters = e.target.checked;
                // 重新构建表头以显示/隐藏筛选行
                buildTableHeader();
                renderTableBody(); // 重新渲染表格体（筛选逻辑会依据showColumnFilters决定是否应用）
            });

            function handleFile(file) {
                if (!file) return;
                // 如果配置了禁用文件上传且已加载嵌入数据，阻止上传
                if (EMBEDDED_DATA_CONFIG.disableFileUpload && state.embeddedDataLoaded) {
                    // 重置fileInput以清除已选文件
                    document.getElementById('fileInput').value = '';
                    return;
                }
                // 用户上传文件时，自动关闭嵌入数据开关并清除嵌入数据状态
                if (state.usingEmbeddedData) {
                    state.usingEmbeddedData = false;
                    state.embeddedDataLoaded = false;
                    embeddedToggle.checked = false;
                    document.getElementById('embeddedBadge').style.display = 'none';
                    document.getElementById('embeddedDataInfo').style.display = 'none';
                }
                document.getElementById('fileName').textContent = file.name;
                document.getElementById('welcomeOverlay').style.display = 'none';
                document.getElementById('tableCard').style.display = 'flex';
                document.getElementById('configBtn').style.display = 'inline-block';

                const reader = new FileReader();
                reader.onload = (e) => {
                    state.originalContent = e.target.result;
                    try {
                        parseData(state.originalContent);
                    } catch (err) {
                        console.error('解析数据出错:', err);
                        alert(senT('parseFail') + err.message);
                        return;
                    }
                    if (state.datasets.length === 0) {
                        alert(senT('noValid'));
                        return;
                    }
                    state.activeIndices = state.datasets.map(d => d.id);
                    if (state.analysisEnabled) buildLimitsPanel();
                    generateProfileAndRateFilters();
                    state.columnFilters = {};
                    state.showColumnFilters = false;
                    toggleFilterCheckbox.checked = false;
                    initColumnFilters();
                    buildTableHeader();
                    renderTableBody();
                    updateChart();
                };
                reader.onerror = () => {
                    alert(senT('readFail'));
                };
                // 显式指定UTF-8编码，避免部分系统默认GBK导致乱码
                reader.readAsText(file, 'UTF-8');
            }

            function parseData(content) {
                const hasV4 = /##Reader_sensitivity_measurement_V4 begin/.test(content);
                const hasV3 = /##Reader_sensitivity_measurement_V3 begin/.test(content);
                state.dataFormat = hasV4 ? 'V4' : (hasV3 ? 'V3' : 'V3');

                const versionTag = state.dataFormat;
                const beginMarker = '##Reader_sensitivity_measurement_' + versionTag + ' begin';
                const endMarker = '##Reader_sensitivity_measurement_' + versionTag + ' end';

                const blocks = content.split(beginMarker);
                const names = content.match(/##name_of_data_set begin\r?\n(.*?)\r?\n##name_of_data_set end/g) || [];
                state.datasets = blocks.slice(1).map((block, i) => {
                    const endIdx = block.indexOf(endMarker);
                    const blockBody = endIdx !== -1 ? block.substring(0, endIdx).trim() : block.split('##')[0].trim();
                    const lines = blockBody.split(/\r?\n/);
                    const data = lines.slice(1).map(l => {
                        const p = l.trim().split(/\s+/);
                        if (p.length < 6) return null;
                        const point = { power: parseFloat(p[0]), sens: parseFloat(p[1]), blf: parseFloat(p[2]), phase: parseFloat(p[3]), rl: parseFloat(p[4]), time: parseFloat(p[5]) };
                        if (p.length >= 7) point.returnPhase = parseFloat(p[6]);
                        return point;
                    }).filter(d => d !== null && !isNaN(d.sens));

                    if (data.length === 0) return null;

                    const sens = data.map(d => d.sens);
                    const powers = data.map(d => d.power).filter(p => !isNaN(p));
                    const nameMatch = (names[i] || 'CH_' + i).replace(/##name_of_data_set begin\r?\n|\r?\n##name_of_data_set end/g, '');
                    return {
                        id: i,
                        name: nameMatch,
                        originalName: nameMatch,
                        data: data,
                        blockContent: blockBody,
                        stats: {
                            min: sens.length > 0 ? Math.min(...sens) : NaN,
                            max: sens.length > 0 ? Math.max(...sens) : NaN,
                            avg: sens.length > 0 ? sens.reduce((a, b) => a + b, 0) / sens.length : NaN,
                            range: sens.length > 0 ? Math.max(...sens) - Math.min(...sens) : NaN,
                            powerAvg: powers.length > 0 ? powers.reduce((a, b) => a + b, 0) / powers.length : NaN,
                            returnLoss: data.find(d => !isNaN(d.rl))?.rl || 19.54
                        }
                    };
                }).filter(ds => ds !== null);
            }

            // 构建表头 (带筛选行)
            function buildTableHeader() {
                const thead = document.querySelector('#statsTable thead');
                thead.innerHTML = '';
                const cols = getCurrentColumns();
                const tr = document.createElement('tr');

                cols.forEach(col => {
                    const th = document.createElement('th');
                    th.setAttribute('data-col', col.key);
                    // 排序标题区
                    const titleSpan = document.createElement('span');
                    titleSpan.className = 'th-content';
                    titleSpan.innerHTML = `<span style="flex:1;">${senT(col.sen)}</span>`;
                    titleSpan.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (state.sort.key === col.key) {
                            state.sort.order = state.sort.order === 'asc' ? 'desc' : 'asc';
                        } else {
                            state.sort.key = col.key;
                            state.sort.order = 'asc';
                        }
                        document.querySelectorAll('#statsTable th').forEach(h => h.classList.remove('sort-asc', 'sort-desc'));
                        th.classList.add(`sort-${state.sort.order}`);
                        renderTableBody();
                    });

                    // 筛选输入区
                    const filterDiv = document.createElement('div');
                    filterDiv.className = 'filter-row';

                    if (col.type === 'text') {
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.placeholder = '筛选...';
                        input.value = state.columnFilters[col.key]?.text || '';
                        input.addEventListener('input', (e) => {
                            state.columnFilters[col.key].text = e.target.value;
                            renderTableBody();
                        });
                        filterDiv.appendChild(input);
                    } else { // number
                        const minInput = document.createElement('input');
                        minInput.type = 'number';
                        minInput.placeholder = '最小值';
                        minInput.className = 'range-min';
                        minInput.value = state.columnFilters[col.key]?.min !== null ? state.columnFilters[col.key].min : '';
                        minInput.addEventListener('input', (e) => {
                            const val = e.target.value === '' ? null : parseFloat(e.target.value);
                            state.columnFilters[col.key].min = val;
                            renderTableBody();
                        });

                        const maxInput = document.createElement('input');
                        maxInput.type = 'number';
                        maxInput.placeholder = '最大值';
                        maxInput.className = 'range-max';
                        maxInput.value = state.columnFilters[col.key]?.max !== null ? state.columnFilters[col.key].max : '';
                        maxInput.addEventListener('input', (e) => {
                            const val = e.target.value === '' ? null : parseFloat(e.target.value);
                            state.columnFilters[col.key].max = val;
                            renderTableBody();
                        });

                        filterDiv.appendChild(minInput);
                        filterDiv.appendChild(maxInput);
                    }

                    // 根据showColumnFilters控制筛选行显示/隐藏
                    filterDiv.style.display = state.showColumnFilters ? 'flex' : 'none';

                    th.appendChild(titleSpan);
                    th.appendChild(filterDiv);
                    tr.appendChild(th);
                });

                thead.appendChild(tr);

                // 设置初始排序样式
                const sortedTh = document.querySelector(`#statsTable th[data-col="${state.sort.key}"]`);
                if (sortedTh) sortedTh.classList.add(`sort-${state.sort.order}`);
            }

            // 渲染表格体 (应用筛选、排序)
            function renderTableBody() {
                const tbody = document.querySelector('#statsTable tbody');
                tbody.innerHTML = '';

                // 基础数据集 (activeIndices)
                let displayData = state.datasets.filter(d => state.activeIndices.includes(d.id));

                // 应用列筛选 (仅当showColumnFilters为true时)
                if (state.showColumnFilters) {
                    displayData = displayData.filter(ds => {
                        const cols = getCurrentColumns();
                        for (let col of cols) {
                            const filter = state.columnFilters[col.key];
                            if (!filter) continue;

                            if (col.type === 'text') {
                                const filterText = filter.text || '';
                                if (filterText === '') continue;
                                let cellValue = '';
                                if (col.key === 'name') cellValue = ds.name;
                                else if (col.key === 'status' && state.analysisEnabled) {
                                    const limit = getLimitForDataset(ds);
                                    cellValue = ds.stats.max <= limit ? 'PASS' : 'FAIL';
                                } else continue;
                                if (!cellValue.toLowerCase().includes(filterText.toLowerCase())) return false;
                            } else { // number
                                let val = null;
                                if (col.key === 'powerAvg') val = ds.stats.powerAvg;
                                else if (col.key === 'returnLoss') val = ds.stats.returnLoss;
                                else if (col.key === 'min') val = ds.stats.min;
                                else if (col.key === 'max') val = ds.stats.max;
                                else if (col.key === 'avg') val = ds.stats.avg;
                                else if (col.key === 'range') val = ds.stats.range;
                                if (val === null) continue;

                                if (filter.min !== null && val < filter.min) return false;
                                if (filter.max !== null && val > filter.max) return false;
                            }
                        }
                        return true;
                    });
                }

                // 排序
                displayData.sort((a, b) => {
                    let va, vb;
                    const key = state.sort.key;
                    if (key === 'name') { va = a.name; vb = b.name; }
                    else if (key === 'powerAvg') { va = a.stats.powerAvg; vb = b.stats.powerAvg; }
                    else if (key === 'returnLoss') { va = a.stats.returnLoss; vb = b.stats.returnLoss; }
                    else if (key === 'min') { va = a.stats.min; vb = b.stats.min; }
                    else if (key === 'max') { va = a.stats.max; vb = b.stats.max; }
                    else if (key === 'avg') { va = a.stats.avg; vb = b.stats.avg; }
                    else if (key === 'range') { va = a.stats.range; vb = b.stats.range; }
                    else if (key === 'status' && state.analysisEnabled) {
                        const limitA = getLimitForDataset(a);
                        const limitB = getLimitForDataset(b);
                        va = a.stats.max <= limitA ? 0 : 1;
                        vb = b.stats.max <= limitB ? 0 : 1;
                    } else return 0;
                    const res = (typeof va === 'string' ? va.localeCompare(vb) : (va > vb ? 1 : -1));
                    return state.sort.order === 'asc' ? res : -res;
                });

                // 构建行
                displayData.forEach(ds => {
                    const tr = document.createElement('tr');
                    if (state.highlightId === ds.id) tr.classList.add('active-row');

                    const cols = getCurrentColumns();
                    cols.forEach(col => {
                        const td = document.createElement('td');
                        if (col.key === 'name') td.textContent = ds.name;
                        else if (col.key === 'powerAvg') td.textContent = ds.stats.powerAvg.toFixed(2);
                        else if (col.key === 'returnLoss') td.textContent = ds.stats.returnLoss.toFixed(2);
                        else if (col.key === 'min') td.textContent = ds.stats.min.toFixed(2);
                        else if (col.key === 'max') td.textContent = ds.stats.max.toFixed(2);
                        else if (col.key === 'avg') td.textContent = ds.stats.avg.toFixed(2);
                        else if (col.key === 'range') td.textContent = ds.stats.range.toFixed(2);
                        else if (col.key === 'status' && state.analysisEnabled) {
                            const limit = getLimitForDataset(ds);
                            const status = ds.stats.max <= limit ? 'PASS' : 'FAIL';
                            td.textContent = status;
                            td.style.color = status === 'PASS' ? 'var(--success-color)' : 'var(--danger-color)';
                            td.style.fontWeight = 'bold';
                        } else td.textContent = '';
                        tr.appendChild(td);
                    });

                    tr.ondblclick = () => {
                        state.highlightId = state.highlightId === ds.id ? null : ds.id;
                        renderTableBody();
                        updateChart();
                    };
                    tbody.appendChild(tr);
                });
            }

            // 辅助函数: parseProfileAndRate, generateProfileAndRateFilters, updateActiveDatasets, applyNameFilter 等保持不变
            function parseProfileAndRate(name) {
                const profiles = ['M4', 'M8', 'FM0', 'M2'];
                let profile = '', rate = '';
                for (let p of profiles) if (name.toUpperCase().includes(p)) { profile = p; break; }
                const m = name.match(/(\d+)K/i);
                if (m) rate = m[1] + 'K';
                if (!rate) {
                    const rlMatch = name.match(/RL(\d+)/i);
                    if (rlMatch) rate = 'RL' + rlMatch[1];
                }
                return { profile, rate };
            }

            function generateProfileAndRateFilters() {
                const container = document.getElementById('filterValuesList');
                container.innerHTML = '';
                const combos = {};
                state.datasets.forEach(ds => {
                    const { profile, rate } = parseProfileAndRate(ds.name);
                    const key = `${profile}-${rate}`;
                    if (!combos[key]) combos[key] = [];
                    combos[key].push(ds.id);
                });
                Object.keys(combos).sort().forEach(key => {
                    const label = document.createElement('label');
                    label.innerHTML = `<input type="checkbox" checked value="${key}"> ${key} <span style="color:var(--text-sub);font-size:9px;">(${combos[key].length})</span>`;
                    label.querySelector('input').onchange = () => {
                        updateActiveDatasets();
                        renderTableBody();
                        updateChart();
                    };
                    container.appendChild(label);
                });
            }

            function updateActiveDatasets() {
                const checked = Array.from(document.querySelectorAll('#filterValuesList input:checked')).map(i => i.value);
                state.activeIndices = [];
                checked.forEach(key => {
                    const [profile, rate] = key.split('-');
                    state.datasets.forEach(ds => {
                        const info = parseProfileAndRate(ds.name);
                        if (info.profile === profile && info.rate === rate) state.activeIndices.push(ds.id);
                    });
                });
                applyNameFilter();
            }

            function applyNameFilter() {
                const kw = document.getElementById('nameFilter').value.trim().toLowerCase();
                if (!kw) return;
                state.activeIndices = state.activeIndices.filter(id => state.datasets.find(d => d.id === id).name.toLowerCase().includes(kw));
            }

            document.getElementById('nameFilter').addEventListener('input', () => {
                updateActiveDatasets();
                renderTableBody();
                updateChart();
            });

            // 合格线面板
            function buildLimitsPanel() {
                if (!state.analysisEnabled) return;
                const container = document.getElementById('limitsList');
                container.innerHTML = '';
                const combos = new Set();
                state.datasets.forEach(ds => {
                    const { profile, rate } = parseProfileAndRate(ds.name);
                    if (profile && rate) combos.add(`${profile}-${rate}`);
                });
                combos.forEach(key => {
                    const row = document.createElement('div');
                    row.className = 'limit-row';
                    row.innerHTML = `
                        <label for="limit-${key}">${key}</label>
                        <input type="number" id="limit-${key}" value="${state.limits[key] ?? '-80'}" step="0.5">
                        <input type="checkbox" id="show-${key}" checked>
                    `;
                    container.appendChild(row);
                    row.querySelector(`#limit-${key}`).onchange = () => {
                        state.limits[key] = parseFloat(row.querySelector(`#limit-${key}`).value);
                        renderTableBody();
                        updateChart();
                    };
                    row.querySelector(`#show-${key}`).onchange = updateChart;
                });
            }

            function getLimitForDataset(ds) {
                const { profile, rate } = parseProfileAndRate(ds.name);
                const key = `${profile}-${rate}`;
                return state.limits[key] !== undefined ? state.limits[key] : -80;
            }

            // 绘图
            function updateChart() {
                if (!window.Plotly) return;
                const tc = getThemeColors();
                const traces = state.datasets.filter(d => state.activeIndices.includes(d.id)).map(ds => {
                    const isH = state.highlightId === null || state.highlightId === ds.id;
                    return {
                        x: ds.data.map(d => d[state.xAxisMode]),
                        y: ds.data.map(d => d.sens),
                        name: ds.name,
                        mode: 'lines+markers',
                        line: { width: isH ? +document.getElementById('lineWidth').value : 1, color: isH ? COLORS[ds.id % COLORS.length] : tc.mutedLine },
                        marker: { size: +document.getElementById('markerSize').value },
                        opacity: isH ? 1 : 0.25,
                        type: 'scatter'
                    };
                });

                if (state.analysisEnabled) {
                    const activeCombos = new Set();
                    state.datasets.filter(d => state.activeIndices.includes(d.id)).forEach(ds => {
                        const { profile, rate } = parseProfileAndRate(ds.name);
                        if (profile && rate) activeCombos.add(`${profile}-${rate}`);
                    });
                    activeCombos.forEach(key => {
                        const show = document.getElementById(`show-${key}`)?.checked;
                        const limit = parseFloat(document.getElementById(`limit-${key}`)?.value);
                        if (show && !isNaN(limit)) {
                            traces.push({
                                x: [+document.getElementById('xMin').value, +document.getElementById('xMax').value],
                                y: [limit, limit],
                                mode: 'lines',
                                name: `${key} Limit`,
                                line: { color: 'red', dash: 'dash', width: 1.5 },
                                hovertemplate: `${key} Limit: ${limit} dBm<extra></extra>`
                            });
                        }
                    });
                }

                /* 新增：缩放后保留当前视图范围并细化刻度；未缩放时用输入框范围 */
                const xRange = viewRange.x || [+document.getElementById('xMin').value, +document.getElementById('xMax').value];
                const yRange = viewRange.y || [+document.getElementById('yMin').value, +document.getElementById('yMax').value];
                const layout = {
                    autosize: true,
                    paper_bgcolor: tc.paperBg,
                    plot_bgcolor: tc.plotBg,
                    margin: { t: 30, r: 200, b: 65, l: 60 },
                    font: { color: tc.textColor },
                    xaxis: {
                        title: state.xAxisMode.toUpperCase(),
                        titlestandoff: 10,
                        range: xRange,
                        dtick: viewRange.x ? niceStep(xRange[1] - xRange[0]) :
                            (+document.getElementById('xStep').value > 0 ? +document.getElementById('xStep').value : null),
                        gridcolor: tc.gridColor,
                        zerolinecolor: tc.gridColor
                    },
                    yaxis: {
                        title: 'Sensitivity (dBm)',
                        range: yRange,
                        dtick: viewRange.y ? niceStep(yRange[1] - yRange[0]) :
                            (+document.getElementById('yStep').value > 0 ? +document.getElementById('yStep').value : null),
                        gridcolor: tc.gridColor,
                        zerolinecolor: tc.gridColor
                    },
                    showlegend: true,
                    legend: { x: 1.02, y: 1, xanchor: 'left', font: { size: 10, color: tc.textColor }, bgcolor: tc.legendBg, bordercolor: tc.gridColor, borderwidth: 1 },
                    hovermode: 'closest'
                };
                Plotly.react('plotDiv', traces, layout, {
                    responsive: true,
                    displaylogo: false,
                    // 禁用可能触发iframe/跨源的功能，避免file://协议下报错
                    modeBarButtonsToRemove: ['sendDataToCloud'],
                    scrollZoom: true
                }).then(attachRelayout); /* react 会清除 .on 处理器，重渲染后重新绑定 */
            }

            /* ===== 新增：缩放状态记录（只记录不重绘，避免任何反馈循环） ===== */
            const viewRange = { x: null, y: null };
            function niceStep(span) {
                if (!isFinite(span) || span <= 0) return null;
                const raw = span / 6.5;
                const pow = Math.pow(10, Math.floor(Math.log10(raw)));
                const seq = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
                for (let i = 0; i < seq.length; i++) if (raw <= seq[i] * pow) return seq[i] * pow;
                return 10 * pow;
            }
            function onRelayout(ed) {
                function rangeOf(axis) {
                    if (ed[axis] && ed[axis].range) return ed[axis].range.slice();
                    const key = axis + '.range';
                    if (ed[key] && ed[key].length === 2) return ed[key].slice();
                    const lo = ed[axis + '.range[0]'], hi = ed[axis + '.range[1]'];
                    return (lo !== undefined && hi !== undefined) ? [lo, hi] : null;
                }
                const xr = rangeOf('xaxis');
                if (xr) viewRange.x = xr;
                const yr = rangeOf('yaxis');
                if (yr) viewRange.y = yr;
                /* 仅记录范围：显示/隐藏、切换语言等重渲染时会沿用缩放视图 */
            }
            function attachRelayout() {
                const gd = document.getElementById('plotDiv');
                if (gd && gd.on) gd.on('plotly_relayout', onRelayout);
            }

            // 事件绑定
            document.getElementById('xAxisMode').onchange = (e) => {
                state.xAxisMode = e.target.value;
                const xMin = document.getElementById('xMin'), xMax = document.getElementById('xMax'), xStep = document.getElementById('xStep');
                if (e.target.value === 'phase') { xMin.value = 0; xMax.value = 360; xStep.value = 45; }
                else if (e.target.value === 'power') { xMin.value = 27; xMax.value = 30; xStep.value = 0.5; }
                else { xMin.value = 0; xMax.value = 30; xStep.value = 5; }
                updateChart();
            };

            ['xMin', 'xMax', 'xStep', 'yMin', 'yMax', 'yStep', 'lineWidth', 'markerSize'].forEach(id => {
                document.getElementById(id).onchange = () => {
                    if (id === 'xMin' || id === 'xMax') viewRange.x = null;
                    if (id === 'yMin' || id === 'yMax') viewRange.y = null;
                    renderTableBody();
                    updateChart();
                };
            });

            document.getElementById('resetViewBtn').onclick = () => {
                document.getElementById('yMin').value = -90;
                document.getElementById('yMax').value = -70;
                document.getElementById('yStep').value = 2;
                viewRange.x = null; viewRange.y = null;
                updateChart();
            };

            document.getElementById('exportChartBtn').onclick = () => Plotly.downloadImage('plotDiv', { format: 'png', filename: 'analysis' });

            // 配置对话框
            function updateConfigExportCount() {
                const count = state.configExportIds.size;
                const total = state.datasets.length;
                document.getElementById('configExportCount').textContent =
                    senT('exportCount').replace('%A%', count).replace('%B%', total);
            }

            function openConfigDialog() {
                if (state.datasets.length === 0) return alert(senT('noData'));
                state.configDeletedIds = new Set();
                state.configExportIds = new Set(state.datasets.map(d => d.id));

                const container = document.getElementById('namesList');
                container.innerHTML = '';

                state.datasets.forEach(ds => {
                    const row = document.createElement('div');
                    row.className = 'name-row';
                    row.dataset.id = ds.id;

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.checked = true;
                    checkbox.className = 'row-checkbox';
                    checkbox.addEventListener('change', () => {
                        if (checkbox.checked) {
                            state.configExportIds.add(ds.id);
                        } else {
                            state.configExportIds.delete(ds.id);
                        }
                        updateConfigExportCount();
                        updateSelectAllState();
                    });

                    const idLabel = document.createElement('span');
                    idLabel.className = 'row-id';
                    idLabel.textContent = `ID ${ds.id}`;

                    const nameInput = document.createElement('input');
                    nameInput.type = 'text';
                    nameInput.value = ds.name;
                    nameInput.dataset.id = ds.id;
                    nameInput.className = 'name-input';

                    const actionBtn = document.createElement('button');
                    actionBtn.type = 'button';
                    actionBtn.className = 'row-action-btn btn-delete';
                    actionBtn.textContent = '✕';
                    actionBtn.title = senT('delCurve');
                    actionBtn.addEventListener('click', () => {
                        const isDeleted = state.configDeletedIds.has(ds.id);
                        if (isDeleted) {
                            state.configDeletedIds.delete(ds.id);
                            state.configExportIds.add(ds.id);
                            row.classList.remove('deleted');
                            checkbox.checked = true;
                            checkbox.disabled = false;
                            actionBtn.className = 'row-action-btn btn-delete';
                            actionBtn.textContent = '✕';
                            actionBtn.title = senT('delCurve');
                            nameInput.disabled = false;
                        } else {
                            state.configDeletedIds.add(ds.id);
                            state.configExportIds.delete(ds.id);
                            row.classList.add('deleted');
                            checkbox.checked = false;
                            checkbox.disabled = true;
                            actionBtn.className = 'row-action-btn btn-restore';
                            actionBtn.textContent = '↩';
                            actionBtn.title = senT('restoreCurve');
                            nameInput.disabled = false;
                        }
                        updateConfigExportCount();
                        updateSelectAllState();
                    });

                    row.appendChild(checkbox);
                    row.appendChild(idLabel);
                    row.appendChild(nameInput);
                    row.appendChild(actionBtn);
                    container.appendChild(row);
                });

                document.getElementById('configSelectAll').checked = true;
                updateConfigExportCount();
                document.getElementById('overlay').style.display = 'block';
                document.getElementById('configDialog').style.display = 'block';
            }

            function updateSelectAllState() {
                const allCheckboxes = document.querySelectorAll('#namesList .row-checkbox');
                const allChecked = Array.from(allCheckboxes).every(cb => cb.checked || cb.disabled);
                document.getElementById('configSelectAll').checked = allChecked;
            }

            document.getElementById('configSelectAll').addEventListener('change', (e) => {
                const checked = e.target.checked;
                document.querySelectorAll('#namesList .row-checkbox').forEach(cb => {
                    if (cb.disabled) return;
                    cb.checked = checked;
                    const id = parseInt(cb.closest('.name-row').dataset.id);
                    if (checked) {
                        state.configExportIds.add(id);
                    } else {
                        state.configExportIds.delete(id);
                    }
                });
                updateConfigExportCount();
            });

            function closeConfigDialog() {
                document.getElementById('overlay').style.display = 'none';
                document.getElementById('configDialog').style.display = 'none';
            }

            function saveNames() {
                document.querySelectorAll('#namesList .name-input').forEach(input => {
                    const id = parseInt(input.dataset.id);
                    const ds = state.datasets.find(d => d.id === id);
                    if (ds) ds.name = input.value.trim();
                });

                if (state.configDeletedIds.size > 0) {
                    state.datasets = state.datasets.filter(d => !state.configDeletedIds.has(d.id));
                    state.datasets.forEach((ds, i) => ds.id = i);
                    state.activeIndices = state.datasets.map(d => d.id);
                    state.configDeletedIds.clear();
                    state.configExportIds.clear();
                }

                if (state.analysisEnabled) buildLimitsPanel();
                generateProfileAndRateFilters();
                initColumnFilters();
                buildTableHeader();
                renderTableBody();
                updateChart();
                closeConfigDialog();
            }

            function exportData() {
                let exportIds = state.configExportIds;
                const inDialog = document.getElementById('configDialog').style.display === 'block';

                if (!inDialog || exportIds.size === 0) {
                    exportIds = new Set(state.datasets.map(d => d.id));
                }

                const nameMap = {};
                if (inDialog) {
                    document.querySelectorAll('#namesList .name-input').forEach(input => {
                        const id = parseInt(input.dataset.id);
                        nameMap[id] = input.value.trim();
                    });
                } else {
                    state.datasets.forEach(ds => { nameMap[ds.id] = ds.name; });
                }

                const sourceDatasets = inDialog
                    ? state.datasets
                    : state.datasets;

                const versionTag = state.dataFormat;
                const expBeginMarker = '##Reader_sensitivity_measurement_' + versionTag + ' begin';
                const expEndMarker = '##Reader_sensitivity_measurement_' + versionTag + ' end';

                const blocks = state.originalContent.split(expBeginMarker);
                const originalNames = state.originalContent.match(/##name_of_data_set begin\r?\n(.*?)\r?\n##name_of_data_set end/g) || [];

                let output = '';
                let nameIndex = 0;

                for (let i = 1; i < blocks.length; i++) {
                    const ds = sourceDatasets.find(d => d.originalName === ((originalNames[i - 1] || '').replace(/##name_of_data_set begin\r?\n|\r?\n##name_of_data_set end/g, '')));
                    const dsId = ds ? ds.id : -1;

                    if (!exportIds.has(dsId)) {
                        nameIndex++;
                        continue;
                    }

                    const block = blocks[i];
                    const endIdx = block.indexOf(expEndMarker);
                    const blockBody = endIdx !== -1 ? block.substring(0, endIdx).trim() : block.trim();
                    const currentName = nameMap[dsId] || (ds ? ds.name : 'CH_' + (i - 1));

                    output += expBeginMarker + '\n';
                    output += blockBody + '\n';
                    output += expEndMarker + '\n';
                    output += '##name_of_data_set begin\n';
                    output += currentName + '\n';
                    output += '##name_of_data_set end\n\n';
                    nameIndex++;
                }

                const blob = new Blob([output.trim()], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `data_${Date.now()}.txt`;
                a.click();
                URL.revokeObjectURL(url);
            }

            // 导出报告 (沿用原有逻辑)
            document.getElementById('exportReportBtn').onclick = () => {
                const choice = prompt(senT('chooseType'));
                if (choice === '1') exportMDReport();
                else if (choice === '2') exportCSVData();
            };

            function exportMDReport() {
                const lines = [
                    '# 📊 **' + senT('repTitle') + '**',
                    `> **${senT('repTime')}：** ${new Date().toLocaleString(senLang() === 'zh' ? 'zh-CN' : 'en-US')}`,
                    `> **${senT('repFile')}：** ${document.getElementById('fileName').textContent || '-'}`,
                    ''
                ];
                lines.push('## 1. 📈 **' + senT('repOverview') + '**');
                lines.push(`- **${senT('repTotal')}：** ${state.datasets.length}`);
                lines.push(`- **${senT('repShown')}：** ${state.activeIndices.length}`);
                lines.push('');
                if (state.analysisEnabled) {
                    lines.push('## 2. 🎯 **' + senT('repLimitsSec') + '**');
                    const allLimits = [];
                    document.querySelectorAll('#limitsList .limit-row').forEach(row => {
                        const key = row.querySelector('label').textContent;
                        const value = parseFloat(row.querySelector('input[type="number"]').value);
                        allLimits.push([key, value]);
                    });
                    if (allLimits.length > 0) {
                        lines.push('| ' + senT('repCombo') + ' | ' + senT('repLimitCol') + ' |');
                        lines.push('|------|--------------|');
                        allLimits.sort(([a], [b]) => a.localeCompare(b)).forEach(([k, v]) => lines.push(`| **${k}** | ${v} |`));
                    } else lines.push('- ' + senT('repNoneSet'));
                    lines.push('');

                    lines.push('## 3. 📊 **' + senT('repSummarySec') + '**');
                    const displayData = state.datasets.filter(d => state.activeIndices.includes(d.id));
                    const summary = {};
                    displayData.forEach(ds => {
                        const { profile, rate } = parseProfileAndRate(ds.name);
                        const key = `${profile}-${rate}`;
                        if (!summary[key]) summary[key] = { total: 0, pass: 0, fail: 0 };
                        summary[key].total++;
                        if (ds.stats.max <= getLimitForDataset(ds)) summary[key].pass++;
                        else summary[key].fail++;
                    });
                    lines.push('| ' + senT('repCombo') + ' | ' + senT('repTotalCol') + ' | ✅ PASS | ❌ FAIL | ' + senT('repRateCol') + ' |');
                    lines.push('|------|------|---------|---------|--------|');
                    Object.entries(summary).sort(([a], [b]) => a.localeCompare(b)).forEach(([k, v]) => {
                        lines.push(`| **${k}** | ${v.total} | ${v.pass} | ${v.fail} | **${(v.pass / v.total * 100).toFixed(1)}%** |`);
                    });
                    lines.push('');
                    const totalPass = Object.values(summary).reduce((sum, v) => sum + v.pass, 0);
                    const totalFail = Object.values(summary).reduce((sum, v) => sum + v.fail, 0);
                    const total = totalPass + totalFail;
                    lines.push('### ' + senT('repOverall'));
                    lines.push(`- **${senT('repTotalTests')}：** ${total}`);
                    lines.push(`- **PASS：** ${totalPass}`);
                    lines.push(`- **FAIL：** ${totalFail}`);
                    lines.push(`- **${senT('repRateCol')}：** **${total > 0 ? (totalPass / total * 100).toFixed(1) : 0}%**`);
                    lines.push('');
                }

                if (state.analysisEnabled) {
                    lines.push('## 4. 📋 **' + senT('repDetail') + '**');
                    lines.push('| 名称 | 发射功率(Power Avg) | 回波损耗(RL) | 最小灵敏度(Min Sens) | 最大灵敏度(Max Sens) | 平均灵敏度(Avg Sens) | 灵敏度范围(Range) | 结果 |');
                    lines.push('|------|---------------------|--------------|---------------------|---------------------|---------------------|------------------|------|');
                } else {
                    lines.push('## 3. 📋 **' + senT('repDetail') + '**');
                    lines.push('| 名称 | 发射功率(Power Avg) | 回波损耗(RL) | 最小灵敏度(Min Sens) | 最大灵敏度(Max Sens) | 平均灵敏度(Avg Sens) | 灵敏度范围(Range) |');
                    lines.push('|------|---------------------|--------------|---------------------|---------------------|---------------------|------------------|');
                }

                const displayData = state.datasets.filter(d => state.activeIndices.includes(d.id));
                displayData.forEach(ds => {
                    if (state.analysisEnabled) {
                        const limit = getLimitForDataset(ds);
                        const status = ds.stats.max <= limit ? 'PASS' : 'FAIL';
                        lines.push(`| ${ds.name} | ${ds.stats.powerAvg.toFixed(2)} | ${ds.stats.returnLoss.toFixed(2)} | ${ds.stats.min.toFixed(2)} | ${ds.stats.max.toFixed(2)} | ${ds.stats.avg.toFixed(2)} | ${ds.stats.range.toFixed(2)} | **${status}** |`);
                    } else {
                        lines.push(`| ${ds.name} | ${ds.stats.powerAvg.toFixed(2)} | ${ds.stats.returnLoss.toFixed(2)} | ${ds.stats.min.toFixed(2)} | ${ds.stats.max.toFixed(2)} | ${ds.stats.avg.toFixed(2)} | ${ds.stats.range.toFixed(2)} |`);
                    }
                });

                const blob = new Blob([lines.join('\n')], { type: 'text/markdown' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `analysis_report_${Date.now()}.md`;
                a.click();
                URL.revokeObjectURL(url);
            }

            function exportCSVData() {
                const hasReturnPhase = state.dataFormat === 'V4';
                let csvContent = hasReturnPhase
                    ? "Dataset Name,Transmit Power (dBm),DSB Receiver Sensitivity(dBm),BLF (kHz),Phase (deg),Return Loss (dB),Time (s),Return Phase (deg)\n"
                    : "Dataset Name,Transmit Power (dBm),DSB Receiver Sensitivity(dBm),BLF (kHz),Phase (deg),Return Loss (dB),Time (s)\n";
                state.datasets.forEach(ds => {
                    ds.data.forEach(point => {
                        let row = '"' + ds.name.replace(/"/g, '""') + '",' + point.power + ',' + point.sens + ',' + point.blf + ',' + point.phase + ',' + point.rl + ',' + point.time;
                        if (hasReturnPhase && point.returnPhase !== undefined) row += ',' + point.returnPhase;
                        else if (hasReturnPhase) row += ',';
                        csvContent += row + '\n';
                    });
                });
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'data_table_' + Date.now() + '.csv';
                a.click();
                URL.revokeObjectURL(url);
            }

            window.updatePlotlyTheme = function () {
                updateChart();
            };

            /* ===== 新增：全部显示 / 全部隐藏 ===== */
            function setAllCombosVisible(visible) {
                document.querySelectorAll('#filterValuesList input[type="checkbox"]').forEach(cb => { cb.checked = visible; });
                updateActiveDatasets();
                renderTableBody();
                updateChart(); /* viewRange 未清除 → 保持当前缩放视图 */
            }
            document.getElementById('showAllBtn').onclick = () => setAllCombosVisible(true);
            document.getElementById('hideAllBtn').onclick = () => setAllCombosVisible(false);

            /* ===== 新增：拖拽文件到图表区域自动解析 ===== */
            const chartArea = document.querySelector('.content-area');
            let dragDepth = 0;
            ['dragenter', 'dragover'].forEach(ev => chartArea.addEventListener(ev, e => {
                e.preventDefault();
                if (ev === 'dragenter') dragDepth++;
                document.getElementById('dropOverlay').style.display = 'flex';
            }));
            ['dragleave', 'drop'].forEach(ev => chartArea.addEventListener(ev, e => {
                e.preventDefault();
                dragDepth = Math.max(0, dragDepth - 1);
                if (dragDepth === 0) document.getElementById('dropOverlay').style.display = 'none';
            }));
            chartArea.addEventListener('drop', e => {
                if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
            });
            document.addEventListener('dragover', e => e.preventDefault());
            document.addEventListener('drop', e => {
                e.preventDefault();
                if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
            });

            /* ===== 新增：中英切换按钮 ===== */
            document.getElementById('langToggle').onclick = () => {
                localStorage.setItem('sen-lang', senLang() === 'zh' ? 'en' : 'zh');
                applySenLang();
            };
            applySenLang();

            // 所有变量和事件绑定初始化完成后，自动加载嵌入数据
            if (hasEmbeddedData()) {
                embeddedToggle.checked = true;
                loadEmbeddedData();
            }
        };

        // 保底初始化：确保即使CDN加载器时序异常，应用仍能正确初始化
        // 当DOM就绪且Plotly已加载时，如果_appInitialized仍为false，则触发初始化
        document.addEventListener('DOMContentLoaded', function () {
            if (window.Plotly && !_appInitialized && window.initPlotlyApp) {
                window.initPlotlyApp();
            }
        });
    </script>
</body>

</html>
