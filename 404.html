<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · 页面不存在 · Gyboy 的小站</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
  <script>
    (function () {
      var t = localStorage.getItem('gyboy-theme');
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-i18n-doc="e404.doc">
  <header class="site-header">
    <div class="container header-inner">
      <a class="back-link" href="/" data-i18n="nav.back">← 返回首页</a>
      <div class="header-actions">
        <button id="theme-toggle" class="icon-btn" data-i18n-title="nav.theme" aria-label="切换明暗主题" title="切换明暗主题">🌙</button>
        <button id="lang-toggle" class="icon-btn lang-btn" aria-label="切换到英文" title="切换到英文">EN</button>
      </div>
    </div>
  </header>

  <main class="container" style="text-align: center; padding: 110px 22px;">
    <div style="font-size: 3.4rem; line-height: 1;">🧭</div>
    <h1 data-i18n="e404.title">404 · 页面不存在</h1>
    <p style="color: var(--text-2);" data-i18n="e404.desc">你要找的页面可能被移动或删除了。</p>
    <p style="margin-top: 26px;"><a class="btn" href="/" data-i18n="e404.go">← 返回首页</a></p>
  </main>

  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/common.js"></script>
</body>
</html>
