<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · 页面不存在 · Gyboy 的小站</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
  <script>
    (function () {
      var t = localStorage.getItem('gyboy-theme');
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <main class="container" style="text-align: center; padding: 110px 22px;">
    <div style="font-size: 3.4rem; line-height: 1;">🧭</div>
    <h1>404 · 页面不存在</h1>
    <p style="color: var(--text-2);">你要找的页面可能被移动或删除了。</p>
    <p style="margin-top: 26px;"><a class="btn" href="/">← 返回首页</a></p>
  </main>
  <script src="/assets/js/common.js"></script>
</body>
</html>
